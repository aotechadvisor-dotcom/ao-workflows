<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Téléchargement — AO Workflows</title>
<style>
  :root{
    --bg:#14171C;--panel:#1B1F26;--line:#2A2F38;--text:#E7E9EC;--muted:#9199A6;
    --accent:#F2A93B;--accent-dim:#3A3226;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.6;}
  h1,h2,.mono{font-family:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:560px;margin:0 auto;padding:0 28px;}

  header{border-bottom:1px solid var(--line);padding:22px 0;}
  header .wrap{display:flex;align-items:center;justify-content:space-between;max-width:1080px;}
  .brand{font-family:'IBM Plex Mono',monospace;font-size:18px;}
  .brand span{color:var(--accent);}

  .center{min-height:70vh;display:flex;align-items:center;justify-content:center;}
  .box{text-align:center;padding:20px 0;}
  .check{
    width:56px;height:56px;border-radius:50%;background:var(--accent-dim);border:1px solid var(--accent);
    display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:26px;color:var(--accent);
  }
  h1{font-size:24px;font-weight:500;margin-bottom:10px;}
  .sub{color:var(--muted);font-size:14.5px;margin-bottom:32px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px;margin-bottom:20px;text-align:left;}
  .panel .label{color:#5B6370;font-size:11.5px;letter-spacing:.4px;margin-bottom:6px;}
  .panel .name{font-size:15px;font-weight:600;}

  .btn-download{
    display:inline-block;width:100%;background:var(--accent);color:#171207;font-weight:600;
    font-size:15px;padding:15px 24px;border-radius:6px;margin-bottom:14px;
  }
  .btn-download:hover{filter:brightness(1.08);}
  .btn-secondary{display:inline-block;color:var(--muted);font-size:13.5px;}
  .btn-secondary:hover{color:var(--text);}

  .note{color:#5B6370;font-size:12.5px;margin-top:28px;line-height:1.7;}
  .loading, .error{color:var(--muted);}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">AO<span>Workflows</span></div>
  </div>
</header>

<div class="center">
  <div class="wrap box" id="content">
    <p class="loading">Chargement...</p>
  </div>
</div>

<script>
async function init(){
  const params = new URLSearchParams(window.location.search);
  const f = params.get('f');
  const content = document.getElementById('content');

  if (!f){
    content.innerHTML = '<p class="error">Lien invalide — aucun fichier spécifié.</p>';
    return;
  }

  try {
    const res = await fetch('catalog_data.json');
    if (!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    const item = data.find(x => x.f === f);

    if (!item){
      content.innerHTML = '<p class="error">Workflow introuvable. Contactez le support avec votre numéro de commande.</p>';
      return;
    }

    const name = cleanName(item.n);
    const fileUrl = `files/${encodeURIComponent(item.f)}`;

    content.innerHTML = `
      <div class="check">✓</div>
      <h1>Paiement confirmé</h1>
      <p class="sub">Votre fichier est prêt à télécharger.</p>
      <div class="panel">
        <div class="label">WORKFLOW</div>
        <div class="name">${name}</div>
      </div>
      <a class="btn-download" href="${fileUrl}" download>Télécharger le fichier .json</a>
      <a class="btn-secondary" href="catalogue.html">← Retour au catalogue</a>
      <p class="note">
        Gardez ce fichier en lieu sûr — importez-le dans n8n via
        "Import from File" ou "Import from URL". Besoin d'aide pour
        l'installation ? <a href="mailto:contact@aoworkflows.com" style="color:var(--accent);">contact@aoworkflows.com</a>
      </p>
    `;
  } catch (err){
    console.error(err);
    content.innerHTML = '<p class="error">Erreur de chargement. Contactez le support.</p>';
  }
}

function cleanName(raw){
  if (!raw) return 'Sans titre';
  let name = String(raw);
  name = name.replace(/\.json$/i, '');
  name = name.replace(/^[^a-zA-Zà-öø-ÿÀ-ÖØ-ß]+/, '');
  name = name.replace(/_/g, ' ');
  name = name.replace(/\s+/g, ' ').trim();
  if (name) name = name.charAt(0).toUpperCase() + name.slice(1);
  return name || String(raw).trim();
}

init();
</script>

</body>
</html>
